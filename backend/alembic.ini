# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(hour)02d%%(minute)02d-%%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters to use for 'slug'
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow alembic to signup multiple database migrations
# in parallel (e.g. distributed deployments)
# version_locations = %(here)s/alembic/versions

# prepend the current path to sys.path
prepend_sys_path = .

# version path separator; defaults to os.pathsep.
# Use os.pathsep for platform-native path separator, or ':' for Unix-style.
# version_path_separator = :

# set to 'true' to search for migrations in directories recursively
# recursive_version_locations = false

# output encoding
# output_encoding = utf-8

sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/ai_doubt_system


[post_write_hooks]
# post_write_hooks defines scripts or methods that are run
# after a new migration revision file is written.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(name)s] %(levelname)-5.5s: %(message)s
datefmt = %H:%M:%S
