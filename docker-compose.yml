version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: doubt_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_doubt_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_doubt_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doubt_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doubt_web
    restart: always
    command: sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_doubt_system
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=PROD_SECRET_KEY_CHANGE_IN_PRODUCTION_ENV
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doubt_worker
    restart: always
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --pool=solo
    volumes:
      - ./backend:/backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_doubt_system
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=PROD_SECRET_KEY_CHANGE_IN_PRODUCTION_ENV
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doubt_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  pgdata:
