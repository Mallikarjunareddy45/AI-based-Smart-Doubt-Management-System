databases:
  - name: ai-doubt-db
    databaseName: ai_doubt_system
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: "Allow connections from anywhere"

services:
  - type: redis
    name: ai-doubt-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: "Allow connections from anywhere"

  - type: web
    name: ai-doubt-backend
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-doubt-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-doubt-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ENVIRONMENT
        value: production

      - key: BACKEND_CORS_ORIGINS
        fromService:
          type: web
          name: ai-doubt-frontend
          property: host

  - type: worker
    name: ai-doubt-worker
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=info --pool=solo
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-doubt-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-doubt-redis
          property: connectionString

      - key: SECRET_KEY
        fromService:
          type: web
          name: ai-doubt-backend
          envVarKey: SECRET_KEY

      - key: ENVIRONMENT
        value: production

  - type: web
    name: ai-doubt-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-doubt-backend
          property: host

      - key: VITE_WS_URL
        fromService:
          type: web
          name: ai-doubt-backend
          property: host